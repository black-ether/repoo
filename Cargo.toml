[package]
name = "repoo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Screen GitHub repositories and count local source lines"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
encoding_rs_io = "0.1"
globset = "0.4"
ignore = "0.4"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokei = { version = "15", default-features = false }
toml = "0.9"

